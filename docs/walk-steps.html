<!doctype html><html lang="en"><meta charset="utf-8"><title>HydroBuddy · Walking sequence</title><style>body{font:16px system-ui;background:#e5eeea;color:#274a43;margin:30px}h1{font-size:26px}p{max-width:800px;line-height:1.6}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}figure{margin:0;background:#f9faf6;border:1px solid #cadad1;border-radius:14px;overflow:hidden}img{width:100%;height:300px;object-fit:contain}figcaption{padding:15px;font-size:13px;min-height:40px}b{display:inline-grid;place-items:center;background:#305e56;color:white;border-radius:50%;width:24px;height:24px;margin-right:7px}@media(max-width:850px){.steps{grid-template-columns:repeat(2,1fr)}}</style><h1>One complete walk, one step at a time.</h1><p>Read left to right, then the second row. The first leg supports while the other lifts, passes and reaches. Then they switch. Both jeans legs are light blue; the outlines show which leg is in front.</p><div class="steps"><figure><img src="../src/renderer/public/walk-v2/step-01.png" alt="Walking pose 1"><figcaption><b>1</b> Near foot lands · far toe trails</figcaption></figure><figure><img src="../src/renderer/public/walk-v2/step-02.png" alt="Walking pose 2"><figcaption><b>2</b> Near foot supports · far heel lifts</figcaption></figure><figure><img src="../src/renderer/public/walk-v2/step-03.png" alt="Walking pose 3"><figcaption><b>3</b> Far knee passes behind</figcaption></figure><figure><img src="../src/renderer/public/walk-v2/step-04.png" alt="Walking pose 4"><figcaption><b>4</b> Far foot reaches forward</figcaption></figure><figure><img src="../src/renderer/public/walk-v2/step-05.png" alt="Walking pose 5"><figcaption><b>5</b> Far foot lands · near toe trails</figcaption></figure><figure><img src="../src/renderer/public/walk-v2/step-06.png" alt="Walking pose 6"><figcaption><b>6</b> Far foot supports · near heel lifts</figcaption></figure><figure><img src="../src/renderer/public/walk-v2/step-07.png" alt="Walking pose 7"><figcaption><b>7</b> Near knee passes in front</figcaption></figure><figure><img src="../src/renderer/public/walk-v2/step-08.png" alt="Walking pose 8"><figcaption><b>8</b> Near foot reaches forward</figcaption></figure></div></html>
